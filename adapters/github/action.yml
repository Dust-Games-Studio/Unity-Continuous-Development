# The GitHub adapter for unityci.
#
# The adapter decides nothing: it installs the binary, supplies inputs and
# credentials, performs the provider-specific cache/artifact wiring, and calls
# `unityci`. The core owns the pass/fail verdict (D4) through the run step's
# exit code and `summary.json`. There is no retry loop and no exit-code
# interpretation here.
name: unityci
description: >-
  Run Unity tests or a build through the provider-neutral unityci core. The core
  owns the result; this action only installs the binary, supplies inputs and
  credentials, caches, and publishes.
author: unity-ci-kit

inputs:
  command:
    description: The run subcommand to execute (test or build).
    required: false
    default: test
  project-path:
    description: Path to the Unity project root, relative to the workspace.
    required: false
    default: .
  config:
    description: >-
      Path to an explicit unity-ci.yml. Empty means the project's own
      unity-ci.yml / unity.ci.yml is discovered at the project root.
    required: false
    default: ''
  output-dir:
    description: Directory that receives summary.json, reports and artifacts.
    required: false
    default: ci-output
  annotations:
    description: Annotation format passed to the core (none or github).
    required: false
    default: github
  license-mode:
    description: >-
      License route (none, serial, floating, offline-file or personal). The
      serial itself is read by the core from UNITY_LICENSE_SERIAL in the
      environment and never appears on a command line.
    required: false
    default: none
  accept-eula:
    description: >-
      Accept the Editor and module licence agreements during an explicit
      install (false or true). This is a declared input, never a silent default.
    required: false
    default: 'false'
  unityci-version:
    description: >-
      Version of @unityci/core to install, or "source" to build the checkout
      this action lives in (the repository's own dogfood workflow).
    required: false
    default: source
  unity-version:
    description: >-
      Editor version, or "from-project" to read ProjectSettings/ProjectVersion.txt.
    required: false
    default: from-project
  build-target:
    description: Build target passed to the core as build.target.
    required: false
    default: StandaloneWindows64
  shards:
    description: Test shard specification N/M, or empty for no sharding.
    required: false
    default: ''
  cache:
    description: >-
      Restore the Editor download cache and the project Library folder
      (true or false).
    required: false
    default: 'true'
  git-credentials:
    description: >-
      How to authenticate private git packages (none or token). The default
      none writes no git configuration.
    required: false
    default: none
  git-token:
    description: >-
      The credential for private git packages. Required when git-credentials is
      token. Read from a repository secret; it is masked before its first use.
    required: false
    default: ''
  git-token-repos:
    description: >-
      Comma-separated owner/repo entries the token is scoped to, or the literal
      "all" to opt in to a host-wide rewrite. Required when git-credentials is
      token; an empty value is a hard error, never a host-wide fallback.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install the unityci binary
      shell: bash
      env:
        UNITYCI_VERSION: ${{ inputs.unityci-version }}
      run: |
        set -euo pipefail
        if [ "$UNITYCI_VERSION" = "source" ]; then
          # The action lives at <repo>/adapters/github, so its checkout is the
          # workspace this binary is built from.
          REPO_ROOT="$(cd "$GITHUB_ACTION_PATH/../.." && pwd)"
          (
            cd "$REPO_ROOT"
            pnpm install --frozen-lockfile
            pnpm --filter @unityci/core build
          )
          mkdir -p "$RUNNER_TEMP/unityci-bin"
          printf '#!/usr/bin/env bash\nexec node "%s" "$@"\n' "$REPO_ROOT/core/dist/bin.js" > "$RUNNER_TEMP/unityci-bin/unityci"
          chmod +x "$RUNNER_TEMP/unityci-bin/unityci"
          echo "$RUNNER_TEMP/unityci-bin" >> "$GITHUB_PATH"
        else
          npm install -g "@unityci/core@${UNITYCI_VERSION}"
          echo "$(npm prefix -g)/bin" >> "$GITHUB_PATH"
        fi

    - name: Install the Unity CLI
      shell: bash
      run: |
        set -euo pipefail
        # The installer takes the latest beta. The core warns when the running
        # CLI is newer than the tested version and never fails on it (GC17).
        curl -fsSL https://unity.com/install.sh | bash
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Install the Editor's runtime libraries
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        set -euo pipefail
        sudo apt-get update
        # This library list is INFERRED, not Unity-published: Unity's last
        # published Linux dependency list dates from Unity 5.x (2015). It is the
        # set Unity's own `ci init` scaffold installs for Ubuntu 24.04. Newer
        # Ubuntu releases renamed several packages with a `t64` suffix, so the
        # primary list uses the 24.04+ names and the fallback drops the suffix
        # for older images.
        if ! sudo apt-get install -y --no-install-recommends \
          libgl1 libglu1-mesa libgtk-3-0t64 libnss3 libasound2t64 libgbm1 \
          libdrm2 libxtst6 libxrandr2 libxcursor1 libxcomposite1 libxdamage1 \
          libxfixes3 libxi6 libxrender1 libxext6 libsm6 libice6 libxkbcommon0 \
          libpango-1.0-0 libpangocairo-1.0-0 libcairo2 libgdk-pixbuf-2.0-0 \
          libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdbus-1-3 \
          libnotify4 libsecret-1-0; then
          echo "::warning::the Ubuntu 24.04+ package names were not all available; using the pre-24.04 names (no t64 suffix) instead."
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglu1-mesa libgtk-3-0 libnss3 libasound2 libgbm1 \
            libdrm2 libxtst6 libxrandr2 libxcursor1 libxcomposite1 libxdamage1 \
            libxfixes3 libxi6 libxrender1 libxext6 libsm6 libice6 libxkbcommon0 \
            libpango-1.0-0 libpangocairo-1.0-0 libcairo2 libgdk-pixbuf-2.0-0 \
            libatk1.0-0 libatk-bridge2.0-0 libcups2 libdbus-1-3 \
            libnotify4 libsecret-1-0
        fi
        ulimit -n 4096

    - name: Read the cache descriptors
      id: cache-info
      if: inputs.cache == 'true'
      shell: bash
      env:
        INPUT_PROJECT_PATH: ${{ inputs.project-path }}
        INPUT_CONFIG: ${{ inputs.config }}
        UNITYCI_EDITOR_VERSION: ${{ inputs.unity-version }}
        UNITYCI_BUILD_TARGET: ${{ inputs.build-target }}
      run: |
        set -euo pipefail
        # The core describes the keys and paths (D7); this adapter only performs
        # the provider-specific restore. cache-info always exits 0 and falls back
        # to a static key, so a cache hint can never fail the job.
        args=(cache-info --json --project-path "$INPUT_PROJECT_PATH")
        if [ -n "$INPUT_CONFIG" ]; then args+=(--config "$INPUT_CONFIG"); fi
        unityci "${args[@]}" > "$RUNNER_TEMP/unityci-cache-info.json"
        node -e "const fs = require('node:fs'); const i = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/unityci-cache-info.json', 'utf8')); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'editor-key=' + i.editor.key + '\nlibrary-key=' + i.library.key + '\n');"

    - name: Restore the Editor download cache
      if: inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        # Only the download cache. The Editor install directory is global and
        # shared with the Hub and other projects, so it is never cached or
        # deleted here.
        path: ~/.config/unityhub/downloads
        key: ${{ steps.cache-info.outputs.editor-key }}

    - name: Restore the project Library cache
      if: inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.project-path }}/Library
        key: ${{ steps.cache-info.outputs.library-key }}

    - name: Configure git credentials for private packages
      if: inputs.git-credentials == 'token'
      shell: bash
      env:
        UNITYCI_GIT_TOKEN: ${{ inputs.git-token }}
        UNITYCI_GIT_REPOS: ${{ inputs.git-token-repos }}
      run: |
        set -euo pipefail
        echo "::add-mask::$UNITYCI_GIT_TOKEN"
        umask 077
        if [ -z "$UNITYCI_GIT_TOKEN" ]; then
          echo "::error::git-credentials is 'token' but git-token is empty. Pass the token through a repository secret."
          exit 64
        fi
        if [ -z "${UNITYCI_GIT_REPOS// /}" ]; then
          echo "::error::git-credentials is 'token' but git-token-repos is empty. Pass a comma-separated list of owner/repo entries, or the literal 'all' to opt in to a host-wide rewrite. The action never falls back to a host-wide rewrite, because that would grant the token read access to every repository on the host."
          exit 64
        fi
        # Written with shell builtins: `git config --global url.…` would put the
        # token in its own argv, visible in the process list and shell tracing.
        # The rewrite lands in ~/.gitconfig, which Unity's Package Manager
        # honours; the global-config environment variable is deliberately never
        # used because the Package Manager ignores it.
        if [ -f "$HOME/.gitconfig" ]; then cp "$HOME/.gitconfig" "$RUNNER_TEMP/gitconfig.snapshot"; fi
        {
          if [ "${UNITYCI_GIT_REPOS}" = "all" ]; then
            printf '[url "https://x-access-token:%s@github.com/"]\n' "$UNITYCI_GIT_TOKEN"
            printf '\tinsteadOf = https://github.com/\n'
          else
            for repo in ${UNITYCI_GIT_REPOS//,/ }; do
              printf '[url "https://x-access-token:%s@github.com/%s.git"]\n' "$UNITYCI_GIT_TOKEN" "$repo"
              printf '\tinsteadOf = https://github.com/%s.git\n' "$repo"
            done
          fi
        } >> "$HOME/.gitconfig"

    - name: Run unityci
      shell: bash
      env:
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_PROJECT_PATH: ${{ inputs.project-path }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_OUTPUT_DIR: ${{ inputs.output-dir }}
        INPUT_ANNOTATIONS: ${{ inputs.annotations }}
        UNITYCI_LICENSE_MODE: ${{ inputs.license-mode }}
        UNITYCI_EDITOR_ACCEPT_EULA: ${{ inputs.accept-eula }}
        UNITYCI_EDITOR_VERSION: ${{ inputs.unity-version }}
        UNITYCI_BUILD_TARGET: ${{ inputs.build-target }}
        UNITYCI_TEST_SHARDS: ${{ inputs.shards }}
      run: |
        set -euo pipefail
        ulimit -n 4096
        args=(
          run "$INPUT_COMMAND"
          --project-path "$INPUT_PROJECT_PATH"
          --output-dir "$INPUT_OUTPUT_DIR"
          --annotations "$INPUT_ANNOTATIONS"
        )
        if [ -n "$INPUT_CONFIG" ]; then args+=(--config "$INPUT_CONFIG"); fi
        unityci "${args[@]}"

    - name: Upload the CI output
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: unityci-${{ inputs.command }}
        path: ${{ inputs.output-dir }}
        if-no-files-found: warn

    - name: Return the licence
      if: always()
      shell: bash
      run: |
        unityci license return || echo "::warning::unityci license return failed — the Unity seat may still be held on this runner"

    - name: Restore the git configuration
      if: always() && inputs.git-credentials == 'token'
      shell: bash
      run: |
        set -euo pipefail
        if [ -f "$RUNNER_TEMP/gitconfig.snapshot" ]; then
          cp "$RUNNER_TEMP/gitconfig.snapshot" "$HOME/.gitconfig" || echo "::warning::could not restore ~/.gitconfig; a private-package rewrite may still be present on this runner"
          rm -f "$RUNNER_TEMP/gitconfig.snapshot"
        else
          rm -f "$HOME/.gitconfig" || echo "::warning::could not remove ~/.gitconfig; a private-package rewrite may still be present on this runner"
        fi
